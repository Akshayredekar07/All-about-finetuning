<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BERT IMDB Sentiment</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        text-align: center;
      }

      input {
        width: 80%;
        padding: 10px;
        font-size: 16px;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }

      #output {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>BERT IMDB Sentiment</h1>
    <p>Type any text and click Echo.</p>

    <input id="text" placeholder="Type something" />
    <button onclick="echo()">Echo</button>

    <p id="output"></p>

    <script>
      function echo() {
        const text = document.getElementById("text").value;
        document.getElementById("output").textContent = text;
      }
    </script>
  </body>
</html>
